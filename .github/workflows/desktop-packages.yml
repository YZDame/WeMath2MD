name: desktop-packages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - 'v*'
    paths:
      - 'desktop_client.py'
      - 'setup_desktop.py'
      - '.github/workflows/desktop-packages.yml'
      - 'requirements.txt'
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cx_Freeze

      - name: Build desktop package (Windows MSI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python setup_desktop.py bdist_msi

      - name: Build desktop package (macOS DMG)
        if: runner.os == 'macOS'
        run: |
          python setup_desktop.py bdist_dmg

      - name: Smoke test build output exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Recurse -Filter *.msi dist | Select-Object -First 1
          if (-not $msi) { throw 'MSI not found under dist/' }

      - name: Smoke test build output exists (macOS)
        if: runner.os == 'macOS'
        run: |
          DMG=$(find dist -name '*.dmg' | head -n 1)
          test -n "$DMG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/**/*.msi
            dist/**/*.dmg
          if-no-files-found: error
